<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GEO-Optimizer icon">
  <defs>
    <linearGradient id="geoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E62FF"/>
      <stop offset="0.55" stop-color="#0FA0E8"/>
      <stop offset="1" stop-color="#08C6D4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#geoBg)"/>

  <!-- Top-left soft highlight -->
  <ellipse cx="20" cy="15" rx="21" ry="12" fill="#FFFFFF" opacity="0.14" transform="rotate(-24 20 15)"/>

  <!-- AI spark -->
  <path d="M48 12 L49.6 16.4 L54 18 L49.6 19.6 L48 24 L46.4 19.6 L42 18 L46.4 16.4 Z" fill="#FFFFFF"/>

  <!-- Magnifier handle -->
  <line x1="35.6" y1="35.6" x2="45.6" y2="45.6" stroke="#FFFFFF" stroke-width="5.4" stroke-linecap="round"/>

  <!-- Lens glass tint -->
  <circle cx="26.5" cy="26.5" r="12.5" fill="#FFFFFF" opacity="0.10"/>

  <!-- Lens ring -->
  <circle cx="26.5" cy="26.5" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Rising trend arrow -->
  <path d="M20.6 32.4 L24.5 28.5 L26.8 30.7 L31 26.4" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27.4 26.4 L31 26.4 L31 30" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
