# ============================================================
# GEO-Optimizer Nginx 配置 (HTTPS + 自动重定向)
# 域名: geo.tool.example.com
# 证书: Let's Encrypt (Certbot 自动续期)
# 安装: cp nginx_geotool.conf /etc/nginx/conf.d/geotool.conf
#       nginx -t && systemctl reload nginx
# ============================================================

upstream geotool_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# MCP 服务端（streamable-HTTP），由 geo-mcp.service 运行于 127.0.0.1:8000
upstream geo_mcp_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---- HTTP → HTTPS 301 重定向 ----
server {
    listen 80;
    server_name geo.tool.example.com;

    # Certbot 续期验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余所有请求 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    server_name geo.tool.example.com;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/geo.tool.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.tool.example.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (可选，确认无误后启用)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # 访问日志
    access_log /var/log/nginx/geotool_access.log;
    error_log  /var/log/nginx/geotool_error.log;

    # 请求体大小（支持文件上传）
    client_max_body_size 50m;

    # 门户静态资源（CSS/JS，由 nginx 直出；产出物下载走 Flask send_file）
    location /static/ {
        alias /opt/geotool/current/src/geo_optimizer/web/portal/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # MCP 服务端（streamable-HTTP）→ 127.0.0.1:8000/mcp
    # 端点: https://geo.tool.example.com/mcp
    # 关键: SSE/流式响应需关闭缓冲与缓存、清空 Connection 头、超长读超时，
    #       否则流式事件会被 nginx 缓冲，导致客户端收不到增量或连接被过早关闭。
    location /mcp {
        proxy_pass http://geo_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # streamable-HTTP 使用普通长连接（非 WebSocket），必须清空 Connection 头
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 与页面请求 → Flask 应用
    location / {
        proxy_pass http://geotool_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket / 长轮询支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（评估任务可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://geotool_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
