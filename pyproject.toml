[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-optimizer"
version = "1.0.0"
description = "GEO (Generative Engine Optimization) 工具链 — 让内容在 AI 搜索引擎中获得更好的引用排名"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "GEO-Optimizer", email = "52859273@qq.com" }]
keywords = ["geo", "seo", "generative-engine-optimization", "ai-search"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "dashscope>=1.14.0",
    "openai>=1.0.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "pymysql>=1.1",
    "pyecharts>=2.0",
    "beautifulsoup4>=4.12",
    "fpdf2>=2.7",
]
mcp = [
    "mcp[cli]>=2.1,<3",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
geo-optimizer = "geo_optimizer.cli:main"
geo-web = "geo_optimizer.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跳过需联网的集成测试；需要时用 -m integration 显式运行。
addopts = "-m 'not integration'"
markers = [
    "integration: 需真实联网（如抓取腾讯云）的集成测试，默认跳过",
]
